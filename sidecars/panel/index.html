<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Style</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #171615;
      --surface: #201e1c;
      --surface-2: #282523;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --fg: #eceae6;
      --muted: #9a958d;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.16);
      --ok: #4ade80;
      --ok-soft: rgba(74, 222, 128, 0.14);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.15);
      --danger: #f87171;
      --radius: 10px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f4ef;
        --surface: #ffffff;
        --surface-2: #f0ece4;
        --border: rgba(26, 24, 22, 0.09);
        --border-strong: rgba(26, 24, 22, 0.18);
        --fg: #1d1b19;
        --muted: #6c675f;
        --accent: #c96442;
        --accent-soft: rgba(201, 100, 66, 0.13);
        --ok: #16a34a;
        --ok-soft: rgba(22, 163, 74, 0.12);
        --warn: #d97706;
        --warn-soft: rgba(217, 119, 6, 0.13);
        --danger: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 12.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
    }
    .header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-ver {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 4px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .pill.ok {
      border-color: rgba(74, 222, 128, 0.28);
      background: var(--ok-soft);
      color: var(--ok);
    }
    .pill.ok .dot { background: var(--ok); }
    .pill.warn {
      border-color: rgba(245, 158, 11, 0.35);
      background: var(--warn-soft);
      color: var(--warn);
    }
    .pill.warn .dot { background: var(--warn); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--fg);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
    }
    .btn:hover { border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .banner {
      display: none;
      background: var(--warn-soft);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: var(--radius);
      padding: 10px 12px;
      flex-direction: column;
      gap: 6px;
    }
    .banner.show { display: flex; }
    .banner-title { font-weight: 600; color: var(--warn); font-size: 12px; }
    .banner-desc { color: var(--fg); font-size: 11.5px; opacity: 0.9; }
    .group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .group-head {
      width: 100%;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 12.5px;
      font-weight: 600;
    }
    .group-head:hover { background: rgba(255, 255, 255, 0.03); }
    .group-head-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .group-count {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--surface-2);
    }
    .group-chev {
      font-size: 10px;
      color: var(--muted);
      transition: transform 140ms ease;
    }
    .group.collapsed .group-chev { transform: rotate(-90deg); }
    .group.collapsed .group-body { display: none; }
    .group-body {
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .row {
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }
    .row.bool-row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .row.dimmed { opacity: 0.45; }
    .row-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .row-title { font-size: 12px; font-weight: 500; color: var(--fg); }
    .row-desc { font-size: 11px; color: var(--muted); }
    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .seg-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 120ms ease;
    }
    .seg-btn:hover { color: var(--fg); border-color: var(--border-strong); }
    .seg-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .switch {
      position: relative;
      width: 34px;
      height: 19px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 140ms ease, border-color 140ms ease;
      padding: 0;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 140ms ease, background 140ms ease;
    }
    .switch.on {
      background: var(--accent);
      border-color: var(--accent);
    }
    .switch.on::after {
      transform: translateX(15px);
      background: #fff;
    }
    .meta-list {
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11.5px;
    }
    .meta-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
    }
    .meta-val {
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 240px;
    }
    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11.5px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { border-color: var(--danger); color: var(--danger); }
  </style>
</head>

          hudTopBar: ['顶部上下文进度条', '在输入框上方显示上下文分段进度条'],

    const GROUPS = [
      { id: 'appearance', icon: '🎨', titleKey: 'grpAppearance', keys: ['language', 'palette', 'homeLayout', 'logoInk', 'sidebarRestyle', 'sidebarCompact', 'composerRestyle', 'placeholderStyle'] },

    const COLLAPSED_KEY = 'agCsPanelCollapsed';
    let collapsed = {};
    try { collapsed = JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '{}') || {}; } catch {}

    let state = { config: { language: 'zh-CN' }, status: null };
    let toastTimer = null;

    function t() {
      const lang = state.config?.language || 'zh-CN';
      return TEXT[lang] || (lang === 'zh-TW' || lang === 'yue' ? TEXT['zh-CN'] : TEXT.en);
    }

    function apiFetch(url, opts = {}) {
      if (window.sidecar && typeof window.sidecar.fetch === 'function') {
        return window.sidecar.fetch(url, opts);
      }
      return fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
    }

    function showToast(msg, isErr = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isErr ? ' err' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = 'toast'; }, 2200);
    }

    function renderHeader() {
      const tr = t();
      const s = state.status;
      document.getElementById('brand-title').textContent = tr.brand;
      document.getElementById('brand-ver').textContent = s?.version ? `v${s.version}` : '';
      document.getElementById('btn-refresh').textContent = tr.refresh;
      document.getElementById('btn-reinject').textContent = tr.reinject;
      document.getElementById('btn-remove').textContent = tr.remove;
      document.getElementById('btn-reset').textContent = tr.reset;
      document.getElementById('cdp-banner-title').textContent = tr.cdpTitle;
      document.getElementById('cdp-banner-desc').textContent = tr.cdpDesc;
      document.getElementById('btn-relaunch').textContent = tr.relaunch;

      const cdpPill = document.getElementById('pill-cdp');
      const cdpTxt = document.getElementById('txt-cdp');
      const banner = document.getElementById('cdp-banner');
      if (s?.cdp?.port) {
        cdpPill.className = 'pill ok';
        cdpTxt.textContent = tr.cdpOk(s.cdp.port, s.cdp.pageCount || 0);
        banner.classList.remove('show');
      } else if (s) {
        cdpPill.className = 'pill warn';
        cdpTxt.textContent = tr.cdpOff;
        banner.classList.add('show');
      } else {
        cdpPill.className = 'pill';
        cdpTxt.textContent = tr.checking;
      }

      const wPill = document.getElementById('pill-watcher');
      const wTxt = document.getElementById('txt-watcher');
      if (s?.watcher?.alive) {
        wPill.className = 'pill ok';
        wTxt.textContent = tr.watcherOn(s.watcher.pid);
      } else if (s) {
        wPill.className = 'pill';
        wTxt.textContent = tr.watcherOff;
      }
    }

    function formatCompanion(c, tr) {
      if (!c || !c.installed) return tr.notInstalled;
      const ver = c.version ? ` v${c.version}` : '';
      return `${c.enabled ? tr.installed : tr.disabled}${ver}`;
    }

    function renderGroups() {
      const tr = t();
      const cfg = state.config || {};
      const root = document.getElementById('groups-root');
      root.innerHTML = '';

      for (const grp of GROUPS) {
        const isCollapsed = Boolean(collapsed[grp.id]);
        const card = document.createElement('div');
        card.className = 'group' + (isCollapsed ? ' collapsed' : '');

        const head = document.createElement('button');
        head.type = 'button';
        head.className = 'group-head';
        head.innerHTML = `<span class="group-head-left"><span>${grp.icon}</span><span>${tr[grp.titleKey]}</span><span class="group-count">${tr.count(grp.keys.length)}</span></span><span class="group-chev">▼</span>`;
        head.addEventListener('click', () => {
          collapsed[grp.id] = !collapsed[grp.id];
          try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(collapsed)); } catch {}
          card.classList.toggle('collapsed', collapsed[grp.id]);
        });
        card.appendChild(head);

        const body = document.createElement('div');
        body.className = 'group-body';

        for (const key of grp.keys) {
          const spec = tr.items[key];
          if (!spec) continue;
          const [title, desc, opts] = spec;
          const curVal = cfg[key];
          const row = document.createElement('div');
          const dimmed =
            (key === 'effortAccent' && cfg.effortSliderStyle !== 'claude') ||
            (key === 'performanceBackdrop' && cfg.effortSliderStyle !== 'liangwufeng');
          if (!opts) {
            row.className = 'row bool-row' + (dimmed ? ' dimmed' : '');
            const info = document.createElement('div');
            info.className = 'row-info';
            info.innerHTML = `<div class="row-title">${title}</div><div class="row-desc">${desc}</div>`;
            const sw = document.createElement('button');
            sw.type = 'button';
            sw.className = 'switch' + (curVal ? ' on' : '');
            sw.setAttribute('aria-pressed', String(Boolean(curVal)));
            sw.addEventListener('click', () => saveSetting(key, !curVal));
            row.appendChild(info);
            row.appendChild(sw);
          } else {
            row.className = 'row' + (dimmed ? ' dimmed' : '');
            const info = document.createElement('div');
            info.className = 'row-info';
            info.innerHTML = `<div class="row-title">${title}</div><div class="row-desc">${desc}</div>`;
            const seg = document.createElement('div');
            seg.className = 'seg';
            for (const [val, label] of opts) {
              const b = document.createElement('button');
              b.type = 'button';
              b.className = 'seg-btn' + (curVal === val ? ' active' : '');
              b.textContent = label;
              b.addEventListener('click', () => {
                if (curVal !== val) saveSetting(key, val);
              });
              seg.appendChild(b);
            }
            row.appendChild(info);
            row.appendChild(seg);
          }
          body.appendChild(row);
        }

        if (grp.showMeta && state.status) {
          const meta = document.createElement('div');
          meta.className = 'meta-list';
          const pages = state.status.cdp?.pages || [];
          const winCount = pages.filter((p) => p.kind === 'window').length;
          const swarmCount = pages.filter((p) => p.kind === 'swarm').length;
          meta.innerHTML = `
            <div class="meta-item"><span>${tr.targetsLabel}</span><span class="meta-val">${winCount} Main · ${swarmCount} Swarm</span></div>
            <div class="meta-item"><span>${tr.capsuleLabel}</span><span class="meta-val">${formatCompanion(state.status.companions?.capsule, tr)}</span></div>
            <div class="meta-item"><span>${tr.bridgeLabel}</span><span class="meta-val">${formatCompanion(state.status.companions?.bridge, tr)}</span></div>
          `;
          body.appendChild(meta);
        }

        card.appendChild(body);
        root.appendChild(card);
      }
    }

    async function saveSetting(key, value) {
      const tr = t();
      try {
        const res = await apiFetch('/api/config', {
          method: 'POST',
          body: JSON.stringify({ key, value }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showToast(tr.fail(key, data?.error || 'invalid'), true);
          return;
        }
        state.config = data.config || { ...state.config, [key]: value };
        renderHeader();
        renderGroups();
        showToast(tr.saved(key));
      } catch (err) {
        showToast(tr.fail(key, err.message || String(err)), true);
      }
    }

    async function refreshStatus() {
      try {
        const res = await apiFetch('/api/status', { method: 'GET' });
        const data = await res.json();
        if (data && data.ok) {
          state.status = data;
          state.config = data.config || state.config;
          renderHeader();
          renderGroups();
        }
      } catch (err) {
        showToast(String(err.message || err), true);
      }
    }

    async function postAction(endpoint, btnId) {
      const tr = t();
      const btn = document.getElementById(btnId);
      const label = btn ? btn.textContent.replace(/^✦\s*/, '') : endpoint;
      if (btn) btn.disabled = true;
      try {
        const res = await apiFetch(endpoint, { method: 'POST', body: '{}' });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showToast(tr.fail(label, data?.reason || data?.error || res.status), true);
        } else {
          if (data.config) state.config = data.config;
          showToast(tr.ok(label));
          await refreshStatus();
        }
      } catch (err) {
        showToast(tr.fail(label, err.message || String(err)), true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', () => refreshStatus());
    document.getElementById('btn-reinject').addEventListener('click', () => postAction('/api/reinject', 'btn-reinject'));
    document.getElementById('btn-remove').addEventListener('click', () => postAction('/api/remove', 'btn-remove'));
    document.getElementById('btn-reset').addEventListener('click', () => postAction('/api/reset', 'btn-reset'));
    document.getElementById('btn-relaunch').addEventListener('click', () => postAction('/api/relaunch', 'btn-relaunch'));

    refreshStatus();
    setInterval(refreshStatus, 6000);
  </script>
</body>
</html>
