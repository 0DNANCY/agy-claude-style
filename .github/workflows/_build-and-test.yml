name: Build & Test (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: 'Optional version override (defaults to package.json version)'
        required: false
        type: string
        default: ''
      artifact_retention_days:
        description: 'Retention days for uploaded build artifacts'
        required: false
        type: number
        default: 7
    outputs:
      version:
        description: 'Resolved build version (without leading v)'
        value: ${{ jobs.test-linux.outputs.version }}
      package_file:
        description: 'Cross-platform plugin archive filename'
        value: ${{ jobs.test-linux.outputs.package_file }}

permissions:
  contents: read

jobs:
  test-linux:
    name: Test & Build Plugin Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      package_file: ${{ steps.meta.outputs.package_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve version and artifact filename
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          eval "$(node --input-type=module -e "
            import { createRequire } from 'node:module';
            import { normalizeVersion, getArtifactNames } from './scripts/build-common.mjs';
            const require = createRequire(import.meta.url);
            const pkg = require('./package.json');
            const ver = normalizeVersion(process.env.INPUT_VERSION || pkg.version);
            const names = getArtifactNames(ver);
            console.log('VERSION=' + JSON.stringify(names.version));
            console.log('PKG_FILE=' + JSON.stringify(names.pluginZip));
          ")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_file=$PKG_FILE" >> "$GITHUB_OUTPUT"
          echo "Resolved build version=$VERSION package_file=$PKG_FILE"

      - name: Run test suite
        run: npm test

      - name: Build cross-platform plugin package
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT_FILE: ${{ steps.meta.outputs.package_file }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/build-package.mjs --version "$BUILD_VERSION" --out "dist/$ARTIFACT_FILE"
          test -f "dist/$ARTIFACT_FILE"

      - name: Upload plugin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/${{ steps.meta.outputs.package_file }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  test-windows:
    name: Test One-Liner & Suite (Windows)
    needs: test-linux
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

  test-macos:
    name: Test One-Liner & Suite (macOS)
    needs: test-linux
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test
