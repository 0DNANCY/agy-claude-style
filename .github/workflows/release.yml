name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0). Leave empty to use v<package.json version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save release as draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release tag and flags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VER}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected a tag starting with 'v' (e.g. v2.1.0)."
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$VERSION" != "$PKG_VER" ]; then
            echo "::warning::Release version ($VERSION) differs from package.json version ($PKG_VER)."
          fi

          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="true"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG version=$VERSION prerelease=$PRERELEASE draft=$DRAFT"

  build-and-test:
    name: Test & Build Artifacts
    needs: prepare
    uses: ./.github/workflows/_build-and-test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact_retention_days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and generate SHA256 checksums
        env:
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          MAC_FILE: ${{ needs.build-and-test.outputs.macos_file }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "$WIN_FILE" || { echo "::error::Missing Windows artifact: $WIN_FILE"; exit 1; }
          test -f "$MAC_FILE" || { echo "::error::Missing macOS artifact: $MAC_FILE"; exit 1; }
          ls -lh "$WIN_FILE" "$MAC_FILE"
          sha256sum "$WIN_FILE" "$MAC_FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          MAC_FILE: ${{ needs.build-and-test.outputs.macos_file }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 📦 开箱即用原生插件安装器 / Standalone Plugin Installers

          **零后台守护进程、零外部依赖**：安装器仅负责将 `agy-claude-style` 原生插件包部署至 Antigravity Desktop 插件目录（`~/.gemini/config/plugins/agy-claude-style`）并自动启用，**安装器本身与磁盘上不包含任何外部 CDP 注入器或开机自启守护进程**。安装后由 Antigravity Desktop 原生插件宿主在内部自动完成 CDP 注入、热更新与右侧 `Claude Style` 控制室挂载（内置 Electron 运行时，目标机器无需安装 Node.js）：

          - **Windows (x64 / Windows 10 & 11)**：下载 \`${WIN_FILE}\`，双击运行一键部署（或更新 / 卸载）Antigravity Desktop 原生插件；升级时自动迁移旧版 `config.json` 至 `~/.gemini/antigravity/plugin_data/agy-claude-style/` 并清理旧版外部 Watcher 与快捷方式残留。
          - **macOS (Apple Silicon + Intel Universal)**：下载 \`${MAC_FILE}\`，打开后运行 `AGY Claude Style.app` 一键部署（或更新 / 卸载）Antigravity Desktop 原生插件；升级时自动迁移旧版 `config.json` 并清理旧版 `LaunchAgent` 与外部启动器残留。
            > **macOS 首次打开提示说明**：本构建采用 Ad-hoc 签名；若 macOS 提示“无法验证开发者”，请**右键点击 App → 打开**，或在终端执行 \`xattr -cr "/Applications/AGY Claude Style.app"\` 后再次打开。
          - **手动原生插件安装（全平台）**：亦可直接执行 \`git clone https://github.com/0DNANCY/agy-claude-style.git ~/.gemini/config/plugins/agy-claude-style\` 后在 Antigravity 插件管理中启用。

          ### 🔐 SHA256 Checksums
          \`\`\`text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          echo '```' >> release-notes.md

          HAS_CHANGELOG=0
          if [ -f CHANGELOG.md ] && command -v python3 >/dev/null 2>&1; then
            if python3 - "$TAG" <<'PY' > changelog-section.md; then
          import re
          import sys

          tag = sys.argv[1].strip()
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read().replace('\r\n', '\n')

          pattern = re.compile(r'^##\s+\[?' + re.escape(tag) + r'\]?(?:\s+-\s+.*|\s*)$', re.MULTILINE)
          m = pattern.search(text)
          if not m:
              sys.exit(1)

          start = m.end()
          nxt = re.search(r'^##\s+', text[start:], re.MULTILINE)
          body = text[start:start + nxt.start()] if nxt else text[start:]
          body = re.sub(r'\n+---\s*$', '', body.strip())
          if not body:
              sys.exit(1)

          print(body)
          PY
              {
                echo ""
                echo "---"
                echo ""
                echo "## 📝 更新日志 / What's Changed"
                echo ""
                cat changelog-section.md
              } >> release-notes.md
              HAS_CHANGELOG=1
            fi
          fi
          echo "HAS_CHANGELOG=$HAS_CHANGELOG" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IS_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$IS_PRERELEASE" \
              --draft="$IS_DRAFT"
            gh release upload "$TAG" release-assets/* --clobber
          else
            CREATE_ARGS=(
              --target "${{ github.sha }}"
              --title "$TAG"
              --notes-file release-notes.md
            )
            if [ "${HAS_CHANGELOG:-0}" != "1" ]; then
              CREATE_ARGS+=(--generate-notes)
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_ARGS+=(--draft)
            fi
            gh release create "$TAG" release-assets/* "${CREATE_ARGS[@]}"
          fi
