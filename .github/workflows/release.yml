name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.1.0). Leave empty to use v<package.json version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save release as draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Pack Source & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          eval "$(node --input-type=module -e "
            import { createRequire } from 'node:module';
            import { normalizeVersion, getArtifactNames } from './scripts/build-common.mjs';
            const require = createRequire(import.meta.url);
            const pkg = require('./package.json');
            const eventName = process.env.GITHUB_EVENT_NAME || '';
            const refName = process.env.GITHUB_REF_NAME || '';
            const inputTag = (process.env.INPUT_TAG || '').trim();
            const tag = eventName === 'push' ? refName : (inputTag || ('v' + pkg.version));
            if (!/^v[0-9A-Za-z._-]+$/.test(tag)) {
              console.error('::error::Invalid release tag: ' + tag);
              process.exit(1);
            }
            const ver = normalizeVersion(tag);
            const names = getArtifactNames(ver);
            if (ver !== pkg.version) {
              console.error('::warning::Release version (' + ver + ') differs from package.json version (' + pkg.version + ').');
            }
            const prerelease = process.env.INPUT_PRERELEASE === 'true' || tag.includes('-') ? 'true' : 'false';
            const draft = process.env.INPUT_DRAFT === 'true' ? 'true' : 'false';
            console.log('TAG=' + JSON.stringify(tag));
            console.log('VERSION=' + JSON.stringify(names.version));
            console.log('PKG_FILE=' + JSON.stringify(names.pluginZip));
            console.log('PRERELEASE=' + JSON.stringify(prerelease));
            console.log('DRAFT=' + JSON.stringify(draft));
          ")"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "package_file=$PKG_FILE"
            echo "prerelease=$PRERELEASE"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag=$TAG version=$VERSION package_file=$PKG_FILE prerelease=$PRERELEASE draft=$DRAFT"

      - name: Run test suite
        run: npm test

      - name: Pack plugin source zip & SHA256
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PKG_FILE: ${{ steps.meta.outputs.package_file }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          node scripts/build-package.mjs --version "$VERSION" --out "release-assets/$PKG_FILE"
          cd release-assets
          test -f "$PKG_FILE" || { echo "::error::Missing package archive: $PKG_FILE"; exit 1; }
          sha256sum "$PKG_FILE" > SHA256SUMS.txt
          ls -lh "$PKG_FILE"
          cat SHA256SUMS.txt

      - name: Prepare Release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PKG_FILE: ${{ steps.meta.outputs.package_file }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## ⚡ 一串命令极速安装 / One-Liner Install (Zero Dependencies)

          纯源码轻量归档包，通过零外部依赖一键命令直接部署 Antigravity 原生插件至 \`~/.gemini/config/plugins/agy-claude-style\` 并自动热启用（升级自动保留 \`config.json\` 与动态壁纸库）：

          - **Windows (PowerShell)**：
            \`\`\`powershell
            irm https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.ps1 | iex
            \`\`\`
            卸载命令：\`& ([scriptblock]::Create((irm https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.ps1))) -Uninstall\`
          - **macOS / Linux (Bash / Zsh)**：
            \`\`\`bash
            curl -fsSL https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.sh | bash
            \`\`\`
            卸载命令：\`curl -fsSL https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.sh | bash -s -- --uninstall\`

          ### 🔐 SHA256 Checksum (\`${PKG_FILE}\`)
          \`\`\`text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          echo '```' >> release-notes.md

          if [ -f CHANGELOG.md ]; then
            if node --input-type=module - "$TAG" <<'JS' > changelog-section.md; then
              import fs from 'node:fs';
              const tag = String(process.argv[2] || '').trim();
              const raw = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const esc = tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const startRe = new RegExp(`^##\\s+\\[?${esc}\\]?(?:\\s+-\\s+.*|\\s*)$`, 'm');
              const m = startRe.exec(raw);
              if (!m) process.exit(1);
              const start = m.index + m[0].length;
              const rest = raw.slice(start);
              const nxt = /^##\s+/m.exec(rest);
              const body = (nxt ? rest.slice(0, nxt.index) : rest).replace(/\n+---\s*$/, '').trim();
              if (!body) process.exit(1);
              process.stdout.write(body + '\n');
          JS
              {
                echo ""
                echo "---"
                echo ""
                echo "## 📝 更新日志 / What's Changed"
                echo ""
                cat changelog-section.md
              } >> release-notes.md
            fi
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          IS_DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          set -euo pipefail
          CREATE_FLAGS=()
          EDIT_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            CREATE_FLAGS+=(--prerelease)
            EDIT_FLAGS+=(--prerelease=true)
          else
            EDIT_FLAGS+=(--prerelease=false)
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            CREATE_FLAGS+=(--draft)
            EDIT_FLAGS+=(--draft=true)
          else
            EDIT_FLAGS+=(--draft=false)
            if [ "$IS_PRERELEASE" != "true" ]; then
              CREATE_FLAGS+=(--latest)
              EDIT_FLAGS+=(--latest)
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${EDIT_FLAGS[@]}"
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --notes-file release-notes.md "${CREATE_FLAGS[@]}"
          fi
