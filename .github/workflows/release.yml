name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.0.0). Leave empty to use v<package.json version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save release as draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release tag and flags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VER}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected a tag starting with 'v' (e.g. v4.0.0)."
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$VERSION" != "$PKG_VER" ]; then
            echo "::warning::Release version ($VERSION) differs from package.json version ($PKG_VER)."
          fi

          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="true"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Test & Build Package
    needs: prepare
    uses: ./.github/workflows/_build-and-test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact_retention_days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled release artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify package and generate SHA256 checksums
        env:
          PKG_FILE: ${{ needs.build-and-test.outputs.package_file }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "$PKG_FILE" || { echo "::error::Missing package artifact: $PKG_FILE"; exit 1; }
          ls -lh "$PKG_FILE"
          sha256sum "$PKG_FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PKG_FILE: ${{ needs.build-and-test.outputs.package_file }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## ⚡ 一串命令极速安装 / One-Liner Install (Zero Dependencies)

          从 \`v4.0.0\` 起全面弃用 \`.exe\` / \`.dmg\` 二进制安装器，采用**零外部依赖一键命令**直接部署 Antigravity 原生插件至 \`~/.gemini/config/plugins/agy-claude-style\` 并自动热启用（无需预装 Git 或外部 Node.js，升级自动保留 \`config.json\` 与动态壁纸库）：

          - **Windows (PowerShell)**：
            \`\`\`powershell
            irm https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.ps1 | iex
            \`\`\`
            卸载命令：\`& ([scriptblock]::Create((irm https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.ps1))) -Uninstall\`
          - **macOS / Linux (Bash / Zsh)**：
            \`\`\`bash
            curl -fsSL https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.sh | bash
            \`\`\`
            卸载命令：\`curl -fsSL https://raw.githubusercontent.com/0DNANCY/agy-claude-style/main/install.sh | bash -s -- --uninstall\`

          ### 🔐 SHA256 Checksum (\`${PKG_FILE}\`)
          \`\`\`text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          echo '```' >> release-notes.md

          if [ -f CHANGELOG.md ] && command -v python3 >/dev/null 2>&1; then
            if python3 - "$TAG" <<'PY' > changelog-section.md; then
          import re
          import sys

          tag = sys.argv[1].strip()
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              text = f.read().replace('\r\n', '\n')

          pattern = re.compile(r'^##\s+\[?' + re.escape(tag) + r'\]?(?:\s+-\s+.*|\s*)$', re.MULTILINE)
          m = pattern.search(text)
          if not m:
              sys.exit(1)

          start = m.end()
          nxt = re.search(r'^##\s+', text[start:], re.MULTILINE)
          body = text[start:start + nxt.start()] if nxt else text[start:]
          body = re.sub(r'\n+---\s*$', '', body.strip())
          if not body:
              sys.exit(1)

          print(body)
          PY
              {
                echo ""
                echo "---"
                echo ""
                echo "## 📝 更新日志 / What's Changed"
                echo ""
                cat changelog-section.md
              } >> release-notes.md
            fi
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IS_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          [ "$IS_PRERELEASE" = "true" ] && EXTRA_FLAGS+=(--prerelease)
          [ "$IS_DRAFT" = "true" ] && EXTRA_FLAGS+=(--draft)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --notes-file release-notes.md "${EXTRA_FLAGS[@]}"
          fi
