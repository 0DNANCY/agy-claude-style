name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0). Leave empty to use v<package.json version>.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Save release as draft'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release tag and flags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${PKG_VER}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected a tag starting with 'v' (e.g. v1.3.0)."
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$VERSION" != "$PKG_VER" ]; then
            echo "::warning::Release version ($VERSION) differs from package.json version ($PKG_VER)."
          fi

          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="true"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=$TAG version=$VERSION prerelease=$PRERELEASE draft=$DRAFT"

  build-and-test:
    name: Test & Build Artifacts
    needs: prepare
    uses: ./.github/workflows/_build-and-test.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      artifact_retention_days: 14

  release:
    name: Publish GitHub Release
    needs: [prepare, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and generate SHA256 checksums
        env:
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          MAC_FILE: ${{ needs.build-and-test.outputs.macos_file }}
        run: |
          set -euo pipefail
          cd release-assets
          test -f "$WIN_FILE" || { echo "::error::Missing Windows artifact: $WIN_FILE"; exit 1; }
          test -f "$MAC_FILE" || { echo "::error::Missing macOS artifact: $MAC_FILE"; exit 1; }
          ls -lh "$WIN_FILE" "$MAC_FILE"
          sha256sum "$WIN_FILE" "$MAC_FILE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release notes
        env:
          WIN_FILE: ${{ needs.build-and-test.outputs.windows_file }}
          MAC_FILE: ${{ needs.build-and-test.outputs.macos_file }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## 📦 开箱即用安装包 / Standalone Downloads

          无需安装 Node.js 或任何运行时依赖，下载后直接运行即可自动配置后台守护与无损注入：

          - **Windows (x64 / Windows 10 & 11)**: 下载 \`${WIN_FILE}\`，双击运行自动安装、开启开机自启并实时注入 Antigravity Desktop。
          - **macOS (Apple Silicon + Intel Universal)**: 下载 \`${MAC_FILE}\`，打开后拖入「应用程序」或直接双击运行 \`AGY Claude Style.app\`（内置 LaunchAgent 登录自启与独立原生守护进程）。
            > **macOS 首次打开提示说明**：本构建采用 Ad-hoc 签名；若 macOS 提示“无法验证开发者”，请**右键点击 App → 打开**，或在终端执行 \`xattr -cr "/Applications/AGY Claude Style.app"\` 后再次打开。

          ### 🔐 SHA256 Checksums
          \`\`\`text
          EOF
          cat release-assets/SHA256SUMS.txt >> release-notes.md
          echo '```' >> release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IS_DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --prerelease="$IS_PRERELEASE" \
              --draft="$IS_DRAFT"
            gh release upload "$TAG" release-assets/* --clobber
          else
            CREATE_ARGS=(
              --target "${{ github.sha }}"
              --title "$TAG"
              --notes-file release-notes.md
              --generate-notes
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              CREATE_ARGS+=(--prerelease)
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              CREATE_ARGS+=(--draft)
            fi
            gh release create "$TAG" release-assets/* "${CREATE_ARGS[@]}"
          fi
